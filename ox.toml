# Sinatra API on puma (bundler) + React SPA (npm) in one repo.

[app]
start  = "bundle exec puma -b tcp://127.0.0.1:$PORT config.ru"
health = "/health"

[static]
dir = "dist"
spa = true
api = ["/api", "/health"]

[build]
commands = ["bundle config set --local deployment true && bundle install", "npm run build"]

[tools]
ruby = "3.4.11"
node = "24"
